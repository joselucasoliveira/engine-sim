name: Build and regression checks

on:
  push:
    branches: [master]
    paths: ['src/**', 'include/**', 'scripting/**', 'es/**', 'assets/**', 'test/**', 'tools/**', 'cmake/**', 'dependencies/**', 'CMakeLists.txt', 'CMakePresets.json', '.github/workflows/**']
  pull_request:
    branches: [master]
    paths: ['src/**', 'include/**', 'scripting/**', 'es/**', 'assets/**', 'test/**', 'tools/**', 'cmake/**', 'dependencies/**', 'CMakeLists.txt', 'CMakePresets.json', '.github/workflows/**']

permissions:
  contents: read

jobs:
  linux-numerical:
    name: Linux x86_64 numerical regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Initialize locked core sources
        run: git submodule update --init -- dependencies/submodules/simple-2d-constraint-solver dependencies/submodules/csv-io
      - name: Replay the clean core checkout
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: >-
          python3 -B tools/verify_build.py --preset core
          --cxx-compiler g++-13
          --out "$RUNNER_TEMP/engine-sim-core" --expected-revision "$EXPECTED_REVISION" --expected-arch x86_64
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: linux-core-logs
          path: ${{ runner.temp }}/engine-sim-core/logs/
          retention-days: 7
          if-no-files-found: warn

  linux-diagnostics:
    name: Linux ${{ matrix.preset }} diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan]
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Prepare capture sources and diagnostic tools
        run: |
          git submodule update --init -- dependencies/submodules/simple-2d-constraint-solver dependencies/submodules/csv-io
          sudo apt-get update
          sudo apt-get install --yes clang-18 llvm-18 bubblewrap
          if ! bwrap --unshare-net --ro-bind / / -- /usr/bin/true; then
            echo "ENGINE_SIM_BWRAP_COMMAND=$(python3 -c 'import json,os; print(json.dumps(["sudo","-n","bwrap","--uid",str(os.getuid()),"--gid",str(os.getgid()),"--cap-drop","ALL"]))')" >> "$GITHUB_ENV"
          fi
      - name: Run all memory diagnostics or the separate threaded selection
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
          EXPECTED_REVISION: ${{ github.sha }}
          ASAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer-18
        run: |
          set -euo pipefail
          compiler=(--cxx-compiler g++-13)
          if test "$PRESET" = asan; then compiler=(--cxx-compiler clang++-18); fi
          python3 -B tools/verify_build.py --preset "$PRESET" --out "$RUNNER_TEMP/engine-sim-$PRESET" \
            --expected-revision "$EXPECTED_REVISION" --expected-arch x86_64 "${compiler[@]}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: linux-${{ matrix.preset }}-logs
          path: ${{ runner.temp }}/engine-sim-${{ matrix.preset }}/logs/
          retention-days: 7
          if-no-files-found: warn

  linux-virtual-desktop:
    name: Linux X11 software Vulkan and virtual audio
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CMAKE_GENERATOR: Ninja
      SDL_VIDEO_DRIVER: x11
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Prepare the explicitly virtual desktop
        run: |
          git submodule update --init -- dependencies/submodules/simple-2d-constraint-solver dependencies/submodules/csv-io
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth mesa-vulkan-drivers libvulkan1 \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdrm-dev libgbm-dev libasound2-dev libpulse-dev bubblewrap
          icd=$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)
          test -n "$icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          if ! bwrap --unshare-net --ro-bind / / -- /usr/bin/true; then
            echo "ENGINE_SIM_BWRAP_COMMAND=$(python3 -c 'import json,os; print(json.dumps(["sudo","-n","bwrap","--uid",str(os.getuid()),"--gid",str(os.getgid()),"--cap-drop","ALL"]))')" >> "$GITHUB_ENV"
          fi
      - name: Exercise the actual installed application
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: >-
          xvfb-run -a -s '-screen 0 2560x1440x24 -nolisten tcp'
          python3 -B tools/verify_build.py --preset desktop --smoke --audio-mode virtual
          --c-compiler gcc-13 --cxx-compiler g++-13
          --out "$RUNNER_TEMP/engine-sim-desktop" --expected-revision "$EXPECTED_REVISION" --expected-arch x86_64
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: linux-virtual-desktop-logs
          path: ${{ runner.temp }}/engine-sim-desktop/logs/
          retention-days: 7
          if-no-files-found: warn
